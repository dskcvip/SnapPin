[workspace]
resolver = "2"
members = ["src-tauri", "core/core-algo", "core/core-platform"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = 3
strip = true
