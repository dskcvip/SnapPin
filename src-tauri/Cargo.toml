[package]
name = "snappin"
version = "0.1.13"
edition = "2021"
rust-version = "1.77.2"
description = "SnapPin - cross-platform screenshot & pin-to-screen desktop tool"
license = "MIT"
# 关闭自动 bin 探测，改由下方 [[bin]] 显式声明，
# 使产物可执行文件名为 SnapPin.exe（而不是 cargo 包名 snappin.exe）
autobins = false

[lib]
name = "snappin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "SnapPin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# 生产模式：启用 tauri 自定义协议，WebviewUrl::App 解析到内嵌的前端资源
# （tauri://localhost），而非 devUrl。不启用时 dev cfg 为 true，
# 裸 cargo run 会去连 http://localhost:5173 导致白屏。
# 等价于 `tauri build` CLI 自动附加的特性。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
# 长截图：从浮层窗口对象取 Win32 HWND（设 WDA 采集排除用）。
# 版本与 tauri 内部依赖锁定一致（workspace lock 0.6.2）。
raw-window-handle = "0.6"
snappin-core-algo = { path = "../core/core-algo" }
snappin-core-platform = { path = "../core/core-platform" }
