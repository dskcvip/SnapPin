<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>SnapPin 长截图回归测试</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px system-ui;background:#edf2f7}header{position:sticky;top:0;height:52px;background:#123a64;color:white;z-index:2;padding:12px 24px}main{width:850px;margin:0 auto;background:white}section{height:160px;padding:12px 24px;border-bottom:1px solid #a8b8c8;position:relative}section:nth-child(3n){background:#f0f7ff}b{font-size:25px}svg{float:right;width:220px;height:110px}small{display:block;margin-top:12px;color:#48647c}.barcode{height:8px;display:flex;margin-top:10px;width:512px}.barcode i{width:16px}</style>
<header>SnapPin 长截图测试 · 160 个编号区块 · 快滚 / 反向 / 重复区域校验 <button onclick="scrollBy(0,480)">下移480px</button><button onclick="scrollBy(0,-480)">上移480px</button><button onclick="scrollTo(0,0)">回顶部</button></header><main id="page"></main>
<script>for(let i=0;i<160;i++){let s=document.createElement('section');s.id='block-'+i;let n=String(i).padStart(3,'0');s.innerHTML=`<svg viewBox="0 0 220 110"><rect width="220" height="110" fill="hsl(${i*37%360} 65% 40%)"/><circle cx="${20+i*17%180}" cy="55" r="28" fill="white"/><text x="100" y="65" fill="white" font-size="32">${n}</text></svg><b>区块 ${n} / 159</b><small>每块固定 160px · 正文行号 ${i*4}–${i*4+3}</small><div class="barcode">${Array.from({length:32},(_,b)=>`<i style="background:${((Math.imul(i+1,2654435761)>>>b)&1)?'#132f50':'#f4f7fa'}"></i>`).join('')}</div>`;document.querySelector('main').append(s)}</script></html>
