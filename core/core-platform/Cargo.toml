[package]
name = "snappin-core-platform"
version = "0.1.0"
edition = "2021"
description = "Platform glue layer for SnapPin: screen capture, clipboard, temp image IO."
license = "MIT"

[dependencies]
snappin-core-algo = { path = "../core-algo" }
xcap = "0.9"
arboard = "3.7"
image = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = "0.4"
rxing = "0.9.3"
rten = "0.27.0"
rten-tensor = "0.27.0"
# 在线翻译（OpenAI 兼容协议）；blocking 版本由调用方放进阻塞线程
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = { workspace = true }
# 模型下载后校验 SHA256（防止镜像返回错误页/半截文件被当成模型）
sha2 = "0.10"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"

[build-dependencies]
cc = "1"
