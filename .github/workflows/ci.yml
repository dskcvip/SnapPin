name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 测试与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 算法层单元测试
        run: cargo test -p snappin-core-algo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装前端依赖
        run: npm ci
      - name: 类型检查 + 前端构建
        run: npm run build

  build:
    name: 构建 (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - name: 安装前端依赖
        run: npm ci
      - name: 构建桌面端
        # --features custom-protocol 必须显式带上：否则 WebviewUrl::App 会去连 devUrl，
        # 打出来的包启动即白屏（cargo 手动构建同理）。
        run: npm run tauri -- build --features custom-protocol
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: snappin-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
