name: Build Flutter macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - codex/flutter-macos
    tags:
      - 'flutter-v*'

jobs:
  dmg:
    name: macOS ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: intel
            runner: macos-15-intel
          - host: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Check Flutter source
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build macOS app
        run: |
          flutter config --no-enable-macos-arm64-only
          flutter build macos --release
      - name: Sign and package DMG
        run: |
          APP='build/macos/Build/Products/Release/SnapPin.app'
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          python3 tool/check_macos_bundle.py "$APP" dist/startup-smoke/bundle-compatibility.json
          bash tool/macos_graphics_smoke.sh "$APP" dist/startup-smoke
          bash tool/macos_runtime_smoke.sh "$APP" dist/startup-smoke
          bash tool/macos_startup_smoke.sh "$APP" dist/startup-smoke
          grep -q 'Using the Skia rendering backend' dist/startup-smoke/console.log
          mkdir -p dist/dmg-root
          cp -R "$APP" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname SnapPin -srcfolder dist/dmg-root -ov -format UDZO dist/SnapPin-Flutter.dmg
          MOUNT="$RUNNER_TEMP/snappin-dmg-check"
          hdiutil attach dist/SnapPin-Flutter.dmg -readonly -nobrowse -mountpoint "$MOUNT"
          test -d "$MOUNT/SnapPin.app"
          test "$(readlink "$MOUNT/Applications")" = /Applications
          hdiutil detach "$MOUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: snappin-flutter-macos-dmg-${{ matrix.host }}
          path: dist/SnapPin-Flutter.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snappin-macos-startup-logs-${{ matrix.host }}
          path: dist/startup-smoke/
          if-no-files-found: ignore
