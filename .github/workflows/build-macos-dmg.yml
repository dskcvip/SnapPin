name: 出 macOS 安装包（dmg）

# 目的：在没有 Mac 的情况下，用 GitHub 的 macOS 云主机打一个真实的 .dmg。
#
# 用法：
#   1) 在 GitHub 建一个空仓库（public 免费额度足够），本仓库执行：
#        git remote add origin https://github.com/<你>/<仓库名>.git
#        git add -A && git commit -m "ci: macOS dmg" && git push -u origin main
#   2) 打开仓库 → Actions → 左侧「出 macOS 安装包（dmg）」→ Run workflow
#   3) 跑完（约 10~15 分钟）在本次运行页面底部 Artifacts 里下载
#      snappin-macos-dmg.zip，解压就是 SnapPin_0.1.0_universal.dmg
#
# 也可以在网页上点 Run workflow 时选只出单一架构（更快）：
#   arch = universal（默认，Apple Silicon + Intel）
#   arch = aarch64  （只出 Apple Silicon，M1/M2/M3/M4）
#   arch = x86_64   （只出 Intel）

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构"
        type: choice
        default: universal
        options:
          - universal
          - aarch64
          - x86_64
  push:
    tags:
      - "v*"

jobs:
  dmg:
    name: 构建 dmg (${{ inputs.arch || 'universal' }})
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 目标
        run: |
          case "${{ inputs.arch || 'universal' }}" in
            universal) rustup target add aarch64-apple-darwin x86_64-apple-darwin ;;
            aarch64)   rustup target add aarch64-apple-darwin ;;
            x86_64)    rustup target add x86_64-apple-darwin ;;
          esac

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 测试长截图算法和帧缓存
        run: |
          HOST_TARGET=$(rustc -vV | sed -n 's/^host: //p')
          cargo test -p snappin-core-algo stitch::tests --lib --release --target "$HOST_TARGET"
          cargo test -p snappin-core-platform capture_stream::tests --lib --release --target "$HOST_TARGET"

      - name: 打包 .app / .dmg
        # --features custom-protocol 必须显式带上，否则 WebviewUrl::App 会去连 devUrl，
        # 打出来的包启动即白屏。
        #
        # 分两次打包（先 app → 签名 → 再 dmg）是刻意的：dmg 里必须装**已签名**的 app。
        run: |
          case "${{ inputs.arch || 'universal' }}" in
            universal) TARGET=universal-apple-darwin ;;
            aarch64)   TARGET=aarch64-apple-darwin ;;
            x86_64)    TARGET=x86_64-apple-darwin ;;
          esac
          # 注意：cargo workspace 的 target 在**仓库根**，不是 src-tauri/target
          APP="target/$TARGET/release/bundle/macos/SnapPin.app"

          # 第一次只出 .app（dmg 里要装已签名的 app）
          npx tauri build --target "$TARGET" --features custom-protocol --bundles app

          # adhoc 签名（--sign - = 本地弱签名，无需开发者证书）。
          #
          # **没有这一步，macOS 的「屏幕录制」授权基本不可能稳定生效**：
          # TCC 按「bundle id + 代码签名」记录授权，完全未签名的 app 每次
          # 被拷贝/重打包后签名都不同，系统设置里即使勾了也匹配不上，
          # 表现就是"给了权限还提示没权限"（2026-10-26 真机实测，13.6.6）。
          # 注意 adhoc 的边界：cdhash 随二进制变化，**每次重新构建都会变**，
          # 所以每升级一版用户都要重新授权一次（删旧条目 → 重新添加 → 勾选 → 重启）。
          # 想做到跨版本免重授权，只能买 Apple Developer 证书做真签名 + notarization。
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"

          # 第二次只出 dmg：不会重新编译，直接把已签名的 app 打进 dmg
          npx tauri build --target "$TARGET" --features custom-protocol --bundles dmg
          echo "=== 产物 ==="
          ls -1 "target/$TARGET/release/bundle/dmg/"*.dmg

      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: snappin-macos-dmg
          if-no-files-found: error
          path: target/*/release/bundle/dmg/*.dmg

      - name: 上传 app（免安装版）
        uses: actions/upload-artifact@v4
        with:
          name: snappin-macos-app
          if-no-files-found: warn
          path: target/*/release/bundle/macos/*.app
